name: build

# Проверки на каждый пуш, установщики и релиз — на тег вида v0.1.0.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Типы, линтер и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  package:
    name: Установщик (${{ matrix.os }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run package:win
            artifact: windows-installer
            files: release/*.exe
          - os: macos-latest
            command: npm run package:mac
            artifact: macos-dmg
            files: release/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Windows-сборку нельзя собрать на macOS и наоборот: каждая идёт на своей машине.
      - run: ${{ matrix.command }}
        env:
          # Без сертификатов electron-builder не пытается подписывать.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Черновик релиза
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - name: Собрать релиз с установщиками
        uses: softprops/action-gh-release@v2
        with:
          # Черновик: перед публикацией можно дописать описание руками.
          draft: true
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*.*
          body: |
            Установщики собраны в CI и **не подписаны**.

            - macOS: откройте `.dmg`, перетащите приложение в Программы. При первом запуске
              нажмите правой кнопкой по иконке и выберите «Открыть», иначе Gatekeeper
              заблокирует запуск неподписанного приложения.
            - Windows: запустите `.exe`. SmartScreen предупредит о неизвестном издателе,
              нужно выбрать «Подробнее» → «Выполнить в любом случае».

            Данные лежат локально: `~/Library/Application Support/doings/database.json`
            на macOS и `%APPDATA%\doings\database.json` на Windows.
