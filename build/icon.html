<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      #icon {
        width: 1024px;
        height: 1024px;
      }
    </style>
  </head>
  <body>
    <svg id="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4b9cff" />
          <stop offset="55%" stop-color="#2f7cf6" />
          <stop offset="100%" stop-color="#1f5fd8" />
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0b2a5e" flood-opacity="0.35" />
        </filter>
      </defs>

      <!-- Centred rounded square, Apple leaves roughly a 10% margin -->
      <rect
        x="80"
        y="80"
        width="864"
        height="864"
        rx="208"
        fill="url(#body)"
        filter="url(#drop)"
      />
      <path
        fill="url(#sheen)"
        d="M288 80h448c115 0 208 93 208 208v34c-96-52-217-82-432-82S176 270 80 322v-34C80 173 173 80 288 80z"
      />

      <!-- Checkmark over a single list line -->
      <path
        d="M300 512l148 148 296-312"
        fill="none"
        stroke="#ffffff"
        stroke-width="92"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M344 776h336"
        stroke="#ffffff"
        stroke-opacity="0.5"
        stroke-width="56"
        stroke-linecap="round"
      />
    </svg>
  </body>
</html>
